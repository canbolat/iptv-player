name: Windows exe derle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dosyalari listele
        shell: pwsh
        run: Get-ChildItem -Recurse -File src | ForEach-Object { $_.FullName }
      - run: npm install
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-Windows
          path: release/*.exe
